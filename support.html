<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поддержка Azkaral</title>
<meta name="description" content="Поддержка приложения Azkaral: вопросы, проблемы и предложения.">
<style>
  :root { color-scheme: light dark; --ink:#3f3220; --muted:#7a6b52; --bg:#fbf5e6; --bg2:#f3e8cf; --card:#fffaf0; --gold:#a77c33; --gold-soft:rgba(167,124,51,.3); --shadow:rgba(96,68,28,.14); }
  @media (prefers-color-scheme: dark) { :root { --ink:#f3ead3; --muted:#b9ae94; --bg:#14291f; --bg2:#0c1a14; --card:#1b3326; --gold:#d9b76a; --gold-soft:rgba(217,183,106,.32); --shadow:rgba(0,0,0,.4); } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; color:var(--ink); background:linear-gradient(180deg,var(--bg),var(--bg2)); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { width:100%; max-width:520px; text-align:center; background:var(--card); border:1px solid var(--gold-soft); border-radius:24px; padding:clamp(28px,7vw,44px) clamp(20px,6vw,36px); box-shadow:0 22px 42px -14px var(--shadow), inset 0 1px 0 rgba(255,255,255,.35); }
  .kicker { margin:0 0 .5rem; color:var(--gold); font-size:.8rem; font-weight:600; letter-spacing:.14em; }
  h1 { margin:0 0 1rem; font-size:clamp(1.6rem,6vw,2rem); line-height:1.2; }
  p { margin:.4rem 0 1.4rem; color:var(--muted); }
  .mail { display:inline-block; padding:.8rem 1.6rem; border:1px solid var(--gold); border-radius:999px; color:var(--gold); font-weight:600; text-decoration:none; word-break:break-all; }
  .mail:hover, .mail:focus-visible { background:var(--gold); color:var(--card); outline:none; }
  footer { margin-top:2rem; padding-top:1.1rem; border-top:1px solid var(--gold-soft); font-size:.9rem; }
  footer a { color:var(--gold); }
</style>
</head>
<body>
<main>
  <p class="kicker">AZKARAL</p>
  <h1>Поддержка Azkaral</h1>
  <p>Если у вас возникли вопросы, проблемы с приложением или предложения по улучшению, напишите нам</p>
  <a class="mail" href="mailto:azkaral@mysaudiya.com">azkaral@mysaudiya.com</a>
  <footer><a href="privacy-policy.html">Политика конфиденциальности</a></footer>
</main>
</body>
</html>
